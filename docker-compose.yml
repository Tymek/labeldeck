services:
  labeldeck:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.12-slim
        REQUIREMENTS: requirements.txt # optional; create if needed
    image: labeldeck:dev
    container_name: labeldeck
    volumes:
      - ./app:/app:rw
      # Alternative: mount your app directory from elsewhere
      #- /path/to/your/app:/app:rw
      
      # CUPS printer access
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock:rw
      - /etc/cups:/etc/cups:ro
    
    # USB printer access (uncomment if using USB printer)
    devices:
      - /dev/usb:/dev/usb  # Grant access to all USB devices
    # Alternative: specific USB device
    # - /dev/bus/usb/001/002:/dev/bus/usb/001/002  # Replace with your printer's USB path
    
    environment:
      - PYTHONUNBUFFERED=1
      # Printer environment variables (customize as needed)
      - PRINTER=dymo450  # or your printer name from 'lpstat -p'
      - PILABEL_MEDIA=w102h252  # Label size
      - PILABEL_COPIES=1
    
    # Run with printer group permissions
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - lp  # Add to lp (line printer) group for printer access
    
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Example overriding command (uncomment to run specific script directly)
    # command: ["python", "/app/main.py"]

volumes: {}
